name: CUC slot audit

on:
  push:
    branches:
      - code-review/tf-integrity-20260903-2217-gpt-5-6-sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit divider and spacing semantics
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import collections, json
          from pathlib import Path

          OUT=Path('slot-audit-v3'); OUT.mkdir(exist_ok=True)

          def split_tf(path):
              ls=Path(path).read_text(encoding='utf-8').splitlines(); i=next(i for i,x in enumerate(ls) if x==''); return ls[:i],ls[i+1:]
          def parse_types(base):
              _,data=split_tf(base/'otype.tf'); out={}
              for line in data:
                  if not line: continue
                  ns,t=line.split('\t',1)
                  if '-' in ns: a,b=map(int,ns.split('-',1))
                  else: a=b=int(ns)
                  out[t]=(a,b)
              return out
          def feature(base,name,start=None,count=None):
              _,data=split_tf(base/f'{name}.tf'); vals={}; n=start
              for line in data:
                  if '\t' in line:
                      h,v=line.split('\t',1)
                      if h.isdigit(): n=int(h)
                      else: v=line
                  else: v=line
                  if n is None: raise ValueError((name,line[:20]))
                  vals[n]=v if v!='' else None; n+=1
              if start is not None and count is not None: return [vals.get(x) for x in range(start,start+count)]
              return vals
          def oslots(base,first):
              _,data=split_tf(base/'oslots.tf'); out={}; n=first
              for line in data:
                  ss=[]
                  for tok in line.split():
                      if '-' in tok:
                          a,b=map(int,tok.split('-',1)); ss.extend(range(a,b+1))
                      else: ss.append(int(tok))
                  out[n]=ss; n+=1
              return out
          def sc(v):
              if v is None or v=='': return 'empty'
              if v==' ': return 'space_ascii'
              if v=='\u00a0': return 'space_nbsp'
              if v.isspace(): return 'whitespace_other'
              return 'visible'
          def cd(c): return dict(sorted(c.items(),key=lambda kv:(-kv[1],str(kv[0]))))

          def audit(version):
              base=Path('tf')/version; T=parse_types(base); slo,shi=T['sign']; ns=shi-slo+1
              sign=feature(base,'sign',1,ns); emen=feature(base,'emen',1,ns); OS=oslots(base,shi+1)
              g=feature(base,'g_cons'); tr=feature(base,'trailer'); tablets=feature(base,'tablet'); lines=feature(base,'line')
              wlo,whi=T['word']; tlo,thi=T['tablet']; llo,lhi=T['line']
              stab=[None]*(ns+1); slin=[None]*(ns+1)
              for t in range(tlo,thi+1):
                  for s in OS[t]: stab[s]=tablets.get(t)
              for l in range(llo,lhi+1):
                  for s in OS[l]: slin[s]=lines.get(l)
              trailer_counts=collections.Counter(); pos=collections.Counter(); unem=collections.Counter(); dot_cross=collections.Counter(); examples=[]
              for w in range(wlo,whi+1):
                  ss=OS.get(w,[]); vals=[sign[s-1] for s in ss]; trailer_counts[tr.get(w) or '<absent>']+=1
                  vis=[i for i,v in enumerate(vals) if sc(v)=='visible']; first=min(vis) if vis else None; last=max(vis) if vis else None
                  has_dot=False; trailing_dot=False; internal_dot=False
                  for i,s in enumerate(ss):
                      v=vals[i]
                      if sc(v) in {'space_ascii','space_nbsp','whitespace_other','empty'}:
                          if first is None: p='placeholder_only_word'
                          elif i<first: p='leading'
                          elif i>last: p='trailing'
                          else: p='internal'
                          pos[(sc(v),p,emen[s-1] or '<absent>')]+=1
                          if not emen[s-1]: unem[(sc(v),p)]+=1
                      if v=='.':
                          has_dot=True
                          if i==last: trailing_dot=True
                          else: internal_dot=True
                  if has_dot:
                      p='trailing' if trailing_dot and not internal_dot else ('internal' if internal_dot and not trailing_dot else 'mixed')
                      dot_cross[(p,tr.get(w) or '<absent>')]+=1
                      if tr.get(w)=='.' and len(examples)<50:
                          examples.append({'word':w,'tablet':stab[ss[0]] if ss else None,'line':slin[ss[0]] if ss else None,'g_cons':g.get(w),'visible':''.join(v or '' for v in vals if sc(v)=='visible'),'dot_position':p,'trailer':'.','slots':[ss[0],ss[-1]] if ss else []})
              return {'version':version,'slots':ns,'sign_classes':cd(collections.Counter(sc(v) for v in sign)),'trailer_counts':cd(trailer_counts),'whitespace_positions':[{'sign_class':k[0],'position':k[1],'emen':k[2],'count':v} for k,v in pos.most_common()],'unemended_whitespace_positions':[{'sign_class':k[0],'position':k[1],'count':v} for k,v in unem.most_common()],'dot_position_x_trailer':[{'dot_position':k[0],'trailer':k[1],'words':v} for k,v in dot_cross.most_common()],'dot_and_trailer_examples':examples}

          cur=audit('0.2.8'); prev=audit('0.2.7')
          def key(rows): return {(x['sign_class'],x['position'],x.get('emen','')):x['count'] for x in rows}
          ck=key(cur['whitespace_positions']); pk=key(prev['whitespace_positions'])
          diff=[{'sign_class':k[0],'position':k[1],'emen':k[2],'change':ck.get(k,0)-pk.get(k,0)} for k in sorted(set(ck)|set(pk)) if ck.get(k,0)-pk.get(k,0)]
          result={'current':cur,'previous':prev,'whitespace_position_diff':sorted(diff,key=lambda x:-abs(x['change']))}
          (OUT/'audit-v3.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          md=['# Divider/spacing audit','','## Current trailer values','','| value | count |','| --- | ---: |']+[f"| `{k}` | {v:,} |" for k,v in cur['trailer_counts'].items()]+['','## Dot-sign position × trailer','','| dot position | trailer | words |','| --- | --- | ---: |']+[f"| `{x['dot_position']}` | `{x['trailer']}` | {x['words']:,} |" for x in cur['dot_position_x_trailer']]+['','## Largest 0.2.7 → 0.2.8 whitespace-position changes','','| sign | position | emen | change |','| --- | --- | --- | ---: |']+[f"| `{x['sign_class']}` | `{x['position']}` | `{x['emen']}` | {x['change']:+,} |" for x in result['whitespace_position_diff'][:30]]+['','## Words with both dot sign and dot trailer','','```json',json.dumps(cur['dot_and_trailer_examples'],ensure_ascii=False,indent=2),'```','']
          (OUT/'audit-v3.md').write_text('\n'.join(md),encoding='utf-8')
          print('\n'.join(md[:160]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cuc-slot-audit-v3
          path: slot-audit-v3/
          if-no-files-found: error
