name: CUC slot audit

on:
  push:
    branches:
      - code-review/tf-integrity-20260903-2217-gpt-5-6-sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical TF slot model
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import collections, hashlib, json
          from pathlib import Path

          BASE = Path('tf/0.2.8')
          OUT = Path('slot-audit-v2'); OUT.mkdir(exist_ok=True)

          def split_tf(path):
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              sep = next(i for i, x in enumerate(lines) if x == '')
              return lines[:sep], lines[sep+1:]

          def otypes():
              _, data = split_tf(BASE/'otype.tf')
              out = {}
              for line in data:
                  if not line: continue
                  ns, typ = line.split('\t', 1)
                  a, b = (map(int, ns.split('-', 1)) if '-' in ns else (int(ns), int(ns)))
                  out[typ] = (a, b)
              return out

          TYPES = otypes(); SIGN_LO, SIGN_HI = TYPES['sign']; NSLOTS = SIGN_HI-SIGN_LO+1

          def feature(name, start=None, count=None):
              _, data = split_tf(BASE/f'{name}.tf')
              vals = {}; node = start
              for line in data:
                  if '\t' in line:
                      h, v = line.split('\t', 1)
                      if h.isdigit(): node = int(h)
                      else: v = line
                  else: v = line
                  if node is None: raise ValueError((name, line[:30]))
                  vals[node] = v if v != '' else None
                  node += 1
              if start is not None and count is not None:
                  return [vals.get(n) for n in range(start, start+count)]
              return vals

          def oslots():
              _, data = split_tf(BASE/'oslots.tf')
              out = {}; node = SIGN_HI + 1
              for line in data:
                  ss=[]
                  for tok in line.split():
                      if '-' in tok:
                          a,b=map(int,tok.split('-',1)); ss.extend(range(a,b+1))
                      else: ss.append(int(tok))
                  out[node]=ss; node+=1
              return out

          def sclass(v):
              if v is None or v == '': return 'empty'
              if v == ' ': return 'space_ascii'
              if v == '\u00a0': return 'space_nbsp'
              if v.isspace(): return 'whitespace_other'
              return 'visible'

          def cd(c): return dict(sorted(c.items(), key=lambda kv:(-kv[1],str(kv[0]))))

          sign = feature('sign', 1, NSLOTS)
          usign = feature('usign', 1, NSLOTS)
          emen = feature('emen', 1, NSLOTS)
          cert = feature('cert', 1, NSLOTS)
          alt = feature('alt', 1, NSLOTS)
          cont = feature('cont', 1, NSLOTS)
          OS = oslots()
          gcons = feature('g_cons')
          trailer = feature('trailer')
          tablets = feature('tablet')
          lines = feature('line')

          word_lo,word_hi=TYPES['word']; tab_lo,tab_hi=TYPES['tablet']; line_lo,line_hi=TYPES['line']

          # Section lookup by slot.
          slot_tablet=[None]*(NSLOTS+1); slot_line=[None]*(NSLOTS+1)
          for t in range(tab_lo,tab_hi+1):
              for s in OS[t]: slot_tablet[s]=tablets.get(t)
          for ln in range(line_lo,line_hi+1):
              for s in OS[ln]: slot_line[s]=lines.get(ln)

          raw_sign=collections.Counter(v if v is not None else '<absent>' for v in sign)
          raw_usign=collections.Counter(v if v is not None else '<absent>' for v in usign)
          sign_usign=collections.Counter((sign[i] if sign[i] is not None else '<absent>', usign[i] if usign[i] is not None else '<absent>') for i in range(NSLOTS))

          gchars=collections.Counter()
          for w in range(word_lo,word_hi+1):
              for ch in (gcons.get(w) or ''): gchars[ch]+=1
          gcharset=set(gchars)
          sign_not_in_gcons=collections.Counter(v for v in sign if v and not v.isspace() and v not in gcharset)

          # Slot-level feature combinations.
          combo=collections.Counter()
          for i in range(NSLOTS):
              combo[(sclass(sign[i]), emen[i] or '<absent>', cert[i] or '<absent>', alt[i] or '<absent>', cont[i] or '<absent>')]+=1

          # Word coverage and positional classification of whitespace/punctuation.
          coverage=[0]*(NSLOTS+1)
          whitespace_pos=collections.Counter(); whitespace_unemended_pos=collections.Counter()
          dot_stats=collections.Counter(); dot_usign=collections.Counter(); dot_emen=collections.Counter(); dot_trailer=collections.Counter()
          word_classes=collections.Counter(); examples=collections.defaultdict(list)
          mismatch_reason=collections.Counter()
          all_words=[]

          for w in range(word_lo,word_hi+1):
              ss=OS.get(w,[])
              for s in ss: coverage[s]+=1
              vals=[sign[s-1] for s in ss]
              vis_idx=[i for i,v in enumerate(vals) if sclass(v)=='visible']
              vis=''.join(vals[i] for i in vis_idx)
              gc=gcons.get(w) or ''
              tab=slot_tablet[ss[0]] if ss else None; ln=slot_line[ss[0]] if ss else None

              if not gc:
                  if not vis_idx: cls='empty_g_cons_placeholder_only'
                  elif all(vals[i]=='.' for i in vis_idx): cls='empty_g_cons_punctuation_only'
                  else: cls='empty_g_cons_visible_other'
              else:
                  if vis==gc: cls='g_cons_exact'
                  elif vis.replace('.','')==gc: cls='g_cons_matches_after_dropping_periods'
                  else: cls='g_cons_other_mismatch'
              word_classes[cls]+=1

              if cls not in {'g_cons_exact'} and len(examples[cls])<30:
                  examples[cls].append({'word':w,'tablet':tab,'line':ln,'g_cons':gc,'visible':vis,'slots':[ss[0],ss[-1]] if ss else [],'trailer':trailer.get(w)})

              if gc and vis!=gc:
                  if vis.replace('.','')==gc: mismatch_reason['period_only']+=1
                  else: mismatch_reason['other']+=1

              first=min(vis_idx) if vis_idx else None; last=max(vis_idx) if vis_idx else None
              for i,s in enumerate(ss):
                  v=vals[i]; sc=sclass(v)
                  if sc in {'space_ascii','space_nbsp','whitespace_other','empty'}:
                      if first is None: pos='placeholder_only_word'
                      elif i<first: pos='leading'
                      elif i>last: pos='trailing'
                      else: pos='internal'
                      whitespace_pos[(sc,pos,emen[s-1] or '<absent>')]+=1
                      if not emen[s-1]: whitespace_unemended_pos[(sc,pos)]+=1
                  if v=='.':
                      if first is None: pos='only_visible'
                      elif i==last: pos='trailing_visible'
                      elif i==first: pos='leading_visible'
                      else: pos='internal_visible'
                      dot_stats[pos]+=1; dot_usign[usign[s-1] or '<absent>']+=1; dot_emen[emen[s-1] or '<absent>']+=1; dot_trailer[trailer.get(w) or '<absent>']+=1
              all_words.append((w,gc,vis,ss))

          # Tablet checks and exact fingerprints.
          tab_rows=[]; siggroups=collections.defaultdict(list); wordgroups=collections.defaultdict(list)
          for t in range(tab_lo,tab_hi+1):
              ss=OS[t]; label=tablets.get(t)
              visible=''.join(sign[s-1] or '' for s in ss if sclass(sign[s-1])=='visible')
              ws=[gc for _,gc,_,wss in all_words if wss and ss and wss[0]>=ss[0] and wss[-1]<=ss[-1] and gc]
              siggroups[hashlib.sha256(visible.encode()).hexdigest()].append(label)
              wordgroups[hashlib.sha256('\u241f'.join(ws).encode()).hexdigest()].append(label)
              tab_rows.append({'tablet':label,'slots':len(ss),'visible_signs':sum(sclass(sign[s-1])=='visible' for s in ss),'nonempty_words':len(ws)})

          result={
              'slot_count':NSLOTS,
              'sign_classes':cd(collections.Counter(sclass(v) for v in sign)),
              'raw_sign_values':cd(raw_sign),
              'raw_usign_values':cd(raw_usign),
              'sign_usign_pairs':[{ 'sign':k[0], 'usign':k[1], 'count':v} for k,v in sign_usign.most_common()],
              'g_cons_characters':cd(gchars),
              'visible_sign_values_not_in_any_g_cons':cd(sign_not_in_gcons),
              'slot_feature_combinations':[{ 'sign_class':k[0], 'emen':k[1], 'cert':k[2], 'alt':k[3], 'cont':k[4], 'count':v} for k,v in combo.most_common()],
              'word_classes':cd(word_classes),
              'mismatch_reasons':cd(mismatch_reason),
              'examples':examples,
              'whitespace_positions':[{ 'sign_class':k[0], 'position':k[1], 'emen':k[2], 'count':v} for k,v in whitespace_pos.most_common()],
              'unemended_whitespace_positions':[{ 'sign_class':k[0], 'position':k[1], 'count':v} for k,v in whitespace_unemended_pos.most_common()],
              'dot_positions':cd(dot_stats),
              'dot_usign_values':cd(dot_usign),
              'dot_emen_values':cd(dot_emen),
              'dot_word_trailer_values':cd(dot_trailer),
              'word_slot_coverage':cd(collections.Counter(coverage[1:])),
              'tablets_zero_visible_signs':[r for r in tab_rows if r['visible_signs']==0],
              'tablets_zero_nonempty_words':[r for r in tab_rows if r['nonempty_words']==0],
              'duplicate_visible_sign_fingerprints':[v for v in siggroups.values() if len(v)>1],
              'duplicate_nonempty_word_fingerprints':[v for v in wordgroups.values() if len(v)>1],
          }
          (OUT/'audit-v2.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')

          md=['# CUC TF 0.2.8 refined slot audit','',f"Slots: **{NSLOTS:,}**",'']
          def table(title,d):
              md.extend([f'## {title}','','| value | count |','| --- | ---: |']); md.extend(f'| `{k}` | {v:,} |' for k,v in d.items()); md.append('')
          table('Sign classes',result['sign_classes']); table('Raw sign values',result['raw_sign_values']); table('Word classes',result['word_classes']); table('Mismatch reasons',result['mismatch_reasons']); table('Visible sign values absent from g_cons character inventory',result['visible_sign_values_not_in_any_g_cons']); table('Dot positions',result['dot_positions']); table('Dot → Unicode sign',result['dot_usign_values']); table('Dot emendation',result['dot_emen_values']); table('Dot word trailer',result['dot_word_trailer_values']); table('Word-slot coverage',result['word_slot_coverage'])
          md += ['## Unemended whitespace positions','','| sign class | position | count |','| --- | --- | ---: |']
          md += [f"| `{r['sign_class']}` | `{r['position']}` | {r['count']:,} |" for r in result['unemended_whitespace_positions']]
          md += ['', '## Non-exact word examples','', '```json', json.dumps(result['examples'],ensure_ascii=False,indent=2), '```','']
          md += ['## Tablet checks','',f"Zero visible signs: **{len(result['tablets_zero_visible_signs'])}**  ",f"Zero non-empty words: **{len(result['tablets_zero_nonempty_words'])}**  ",f"Duplicate visible-sign fingerprints: **{len(result['duplicate_visible_sign_fingerprints'])} groups**  ",f"Duplicate non-empty-word fingerprints: **{len(result['duplicate_nonempty_word_fingerprints'])} groups**",'']
          (OUT/'audit-v2.md').write_text('\n'.join(md),encoding='utf-8')
          print('\n'.join(md[:180]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cuc-slot-audit-v2
          path: slot-audit-v2/
          if-no-files-found: error
